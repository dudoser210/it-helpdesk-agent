groups:
  - name: helpdesk
    rules:
      - alert: HelpDeskAgentDown
        expr: up{job="helpdesk-agent"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "HelpDesk Agent недоступен"
      - alert: HelpDeskHighLLMErrorRate
        expr: sum(rate(helpdesk_llm_errors_total[5m])) / clamp_min(sum(rate(helpdesk_agent_runs_total[5m])), 0.01) > 0.1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Доля ошибок LLM выше 10%"
      - alert: HelpDeskSlowResponses
        expr: histogram_quantile(0.95, sum(rate(helpdesk_request_duration_seconds_bucket[10m])) by (le)) > 60
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "p95 обработки заявки выше 60 секунд"
